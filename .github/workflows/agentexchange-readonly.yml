name: AgentExchange read-only check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agentexchange-readonly.yml"
      - "scripts/agentexchange_readonly.py"
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out only this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check AgentExchange read-only MCP tools
        env:
          AGENTEXCHANGE_API_KEY: ${{ secrets.AGENTEXCHANGE_API_KEY }}
        run: python3 -B scripts/agentexchange_readonly.py
