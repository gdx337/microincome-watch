name: AgentExchange one-time client outreach
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agentexchange-contact-once.yml"
      - "scripts/agentexchange_contact_once.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout minimal client script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Send one no-spend proposal only if safe
        env:
          AGENTEXCHANGE_API_KEY: ${{ secrets.AGENTEXCHANGE_API_KEY }}
        run: python3 -B scripts/agentexchange_contact_once.py
