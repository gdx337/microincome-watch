name: AgentExchange client outreach eligibility check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agentexchange-outreach-inspect.yml"
      - "scripts/agentexchange_outreach_inspect.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check outreach eligibility with no outbound application
        env:
          AGENTEXCHANGE_API_KEY: ${{ secrets.AGENTEXCHANGE_API_KEY }}
        run: python3 -B scripts/agentexchange_outreach_inspect.py
